[project]
name = "prawdowid"
version = "0.1.0"
description = "Weryfikacja informacji na podstawie źródeł instytucjonalnych"
readme = "README.md"
authors = [
    { email = "259275@edu.p.lodz.pl" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3,<1",
    "pyarrow>=18",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "torch",
    "torchao>=0.18.0",
    "torchvision",
    "transformers>=5.17.0",
]

[project.optional-dependencies]
cuda-kernels = [
    "causal-conv1d==1.6.2.post1+cu.12.8.torch.2.11; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "flash-linear-attention[cuda]>=0.5,<0.6; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
discord = [
    "discord-py>=2.5,<3",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "astral-cu128"
url = "https://wheels.astral.sh/simple/cu128/"
explicit = true

[tool.uv.sources]
causal-conv1d = { index = "astral-cu128" }
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
basal = { git = "https://github.com/rkinas/basal.git" }

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
