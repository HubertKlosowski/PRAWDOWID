[project]
name = "prawdowid"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "259275@edu.p.lodz.pl" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "torch",
    "torchao>=0.18.0",
    "torchvision",
    "transformers>=5.17.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
basal = { git = "https://github.com/rkinas/basal.git" }

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
